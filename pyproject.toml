[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-server-studio"
version = "1.0.0"
description = "Panel de escritorio en Python puro para configurar, gestionar y moderar servidores de Discord manualmente."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.0"]
license = { text = "MIT" }
authors = [{ name = "Discord Server Studio" }]
keywords = ["discord", "moderacion", "tkinter", "escritorio", "administracion"]

[project.optional-dependencies]
voice = ["discord.py[voice]>=2.4", "discord-ext-voice-recv>=0.5", "PyNaCl>=1.5"]
classifiers = [
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
discord-server-studio = "dss.cli:run"

[tool.setuptools]
packages = ["dss", "dss.ui", "dss.ui.pages"]

[tool.setuptools.package-data]
"dss.ui" = ["assets/*"]
